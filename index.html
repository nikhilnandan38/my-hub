<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nikhil's Hub</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1c1c1c; --muted:#666; --card:#fff; --line:#e3e3e0; --accent:#2f5bd3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --muted:#9a9a9a; --card:#1d1d1d; --line:#2c2c2c; --accent:#7d9bff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 4px; font-size:2rem; }
  p.sub { margin:0 0 32px; color:var(--muted); }
  h2 { font-size:.85rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:32px 0 12px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); }
  a.card { display:block; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:10px; color:inherit; text-decoration:none; }
  a.card:hover { border-color:var(--accent); }
  a.card strong { display:block; color:var(--accent); }
  a.card span { font-size:.9rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Nikhil Chekkattu Nandan</h1>
  <p class="sub">Projects, coursework and profiles in one place.</p>

  <h2>Repositories</h2>
  <div class="grid">
    <a class="card" href="https://github.com/nikhilnandan38/nikhil-chekkattu-nandan"><strong>nikhil-chekkattu-nandan</strong><span>Python, exercises, presentations</span></a>
    <a class="card" href="https://github.com/nikhilnandan38/hcd-slides"><strong>hcd-slides</strong><span>Human-Centred Design slides</span></a>
    <a class="card" href="https://github.com/nikhilnandan38/files"><strong>files</strong><span>Course reading</span></a>
    <a class="card" href="https://github.com/nikhilnandan38/nikhilnandan38"><strong>Profile</strong><span>GitHub profile README</span></a>
  </div>

  <h2>Profiles</h2>
  <div class="grid">
    <a class="card" href="https://github.com/nikhilnandan38"><strong>GitHub</strong><span>@nikhilnandan38</span></a>
  </div>
</main>
</body>
</html>
